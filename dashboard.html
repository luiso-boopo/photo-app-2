<!-- DASHBOARD.HTML (with absolute URL redirect and OAuth-safe setup) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* --- Your original styling (unchanged) --- */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2 { color: #222; margin-top: 0; }
        button { padding: 8px 15px; border: none; border-radius: 5px; background-color: #007bff; color: white; cursor: pointer; transition: background-color 0.2s ease; }
        button:hover { background-color: #0056b3; }
        .header-bar { background-color: #fff; padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .welcome-message { font-size: 1.1em; font-weight: bold; margin-left: 20px; color: #555; }
        #logout { background-color: #dc3545; margin-left: 10px; }
        #logout:hover { background-color: #c82333; }
        #settingsPanel { position: fixed; top: 100px; right: 20px; width: 300px; background:#fff; border:1px solid #ccc; border-radius: 8px; padding:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1000; display:none; }
        .tab-nav { display: flex; justify-content: center; background-color: #e9ecef; border-bottom: 2px solid #ced4da; padding: 0 20px; }
        .tab-button { padding: 12px 25px; cursor: pointer; background-color: transparent; border: none; border-bottom: 3px solid transparent; font-size: 1.1em; font-weight: bold; color: #6c757d; }
        .tab-button.active { color: #007bff; border-bottom: 3px solid #007bff; background-color: #fff; }
        .main-content-area { flex-grow: 1; background-color: #fff; padding: 30px 20px; margin: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: none; overflow-y: auto; }
        .main-content-area.active { display: block; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding-top: 15px; }
        .file-card { border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; text-align: center; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .file-card img, .file-card video { width: 100%; height: 130px; object-fit: cover; margin-bottom: 8px; }
        .live-cam-container { display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e9ecef; border-radius: 8px; background-color: #fcfcfc; }
        #camera { width: 100%; max-height: 400px; border:1px solid #ddd; background:#000; margin-bottom: 15px; border-radius: 4px; }
        #canvas { display:none; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="left-group">
            <h1 style="margin:0; font-size: 1.5em;">Dashboard</h1>
            <span id="userEmailDisplay" class="welcome-message">Welcome! Loading User...</span>
        </div>
        <div class="right-group">
            <button id="openSettingsBtn">Settings</button>
            <button id="logout">Logout</button>
        </div>
    </div>

    <div id="settingsPanel">
        <h2>Settings</h2>
        <button id="cameraPermissionBtn">Request Camera Access</button><br>
        <button id="toggleCameraBtn">Turn Camera Off</button><br>
        <a href="https://supabase.com/docs/guides/auth/auth-password-reset" target="_blank"><button>Change Password</button></a>
        <p><strong>Storage Used:</strong> <span id="storageInfo">Loading...</span></p>
        <button id="closeSettingsBtn">Close</button>
    </div>

    <div class="tab-nav">
        <button class="tab-button active" onclick="openTab(event, 'PhotosTab')">Photos</button>
        <button class="tab-button" onclick="openTab(event, 'LiveCamTab')">Live Cam</button>
        <button class="tab-button" onclick="openTab(event, 'VideosTab')">Videos</button>
    </div>

    <div id="PhotosTab" class="main-content-area active"><h2>Your Photos</h2><div id="photoList" class="file-grid"></div></div>
    <div id="LiveCamTab" class="main-content-area"><h2>Live Camera & Upload</h2><div class="live-cam-container"><video id="camera" autoplay playsinline></video><canvas id="canvas"></canvas><button id="captureBtn">Take Picture</button><h3>Or Upload a File</h3><input type="file" id="fileInput" /><button id="uploadBtn">Upload</button></div></div>
    <div id="VideosTab" class="main-content-area"><h2>Your Videos</h2><div id="videoList" class="file-grid"></div></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const SUPABASE_URL = "https://ywivqcxjtvmztktwlepj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aXZxY3hqdHZmenRrdHdsZXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzA3NDksImV4cCI6MjA2NzA0Njc0OX0.4KUAOSRj4lnG_HCa-YNGeSReKT99qsEOQeM_s";

    const LOGIN_URL = "https://luiso-boopo.github.io/photo-app-2/login.html"; // ✅ absolute URL

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const logoutBtn = document.getElementById("logout");
    const photoList = document.getElementById("photoList");
    const videoList = document.getElementById("videoList");
    const userEmailDisplay = document.getElementById("userEmailDisplay");
    const camera = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const captureBtn = document.getElementById("captureBtn");
    let cameraStream = null;
    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const cameraPermissionBtn = document.getElementById("cameraPermissionBtn");
    const toggleCameraBtn = document.getElementById("toggleCameraBtn");
    const storageInfo = document.getElementById("storageInfo");
    const MAX_STORAGE = 5 * 1024 * 1024 * 1024;

    // OAuth event fix
    sb.auth.onAuthStateChange(async (event, session) => {
        if (event === "SIGNED_IN" && session) {
            userEmailDisplay.textContent = `Welcome, ${session.user.email}!`;
            loadFiles();
            loadStorageUsage();
        }
        if (event === "SIGNED_OUT") window.location.href = LOGIN_URL;
    });

    setTimeout(async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return (window.location.href = LOGIN_URL);
        userEmailDisplay.textContent = `Welcome, ${session.user.email}!`;
        loadFiles();
        loadStorageUsage();
    }, 600);

    logoutBtn.addEventListener("click", async () => {
        await sb.auth.signOut();
        window.location.href = LOGIN_URL;
    });

    function sanitize(name) {
        return name.replace(/[^a-zA-Z0-9._-]/g, "_");
    }

    uploadBtn.addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) return alert("Choose a file first");
        const { data: { session } } = await sb.auth.getSession();
        const path = `${session.user.id}/${Date.now()}-${sanitize(file.name)}`;
        await sb.storage.from("user-uploads").upload(path, file);
        fileInput.value = "";
        loadFiles();
        loadStorageUsage();
    });

    async function loadFiles() {
        const { data: { session } } = await sb.auth.getSession();
        const { data } = await sb.storage.from("user-uploads").list(session.user.id);
        photoList.innerHTML = "";
        videoList.innerHTML = "";
        for (const file of data) {
            const { data: signed } = await sb.storage.from("user-uploads").createSignedUrl(`${session.user.id}/${file.name}`, 3600);
            const div = document.createElement("div");
            div.className = "file-card";
            if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                const img = document.createElement("img");
                img.src = signed.signedUrl;
                div.appendChild(img);
                photoList.appendChild(div);
            } else if (file.name.match(/\.(mp4|mov|avi|webm)$/i)) {
                const vid = document.createElement("video");
                vid.src = signed.signedUrl;
                vid.controls = true;
                div.appendChild(vid);
                videoList.appendChild(div);
            }
        }
    }

    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            camera.srcObject = stream;
            cameraStream = stream;
        });
    }

    function stopCamera() {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        camera.srcObject = null;
        cameraStream = null;
    }

    captureBtn.addEventListener("click", async () => {
        if (!cameraStream) return alert("Camera is off");
        const ctx = canvas.getContext("2d");
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;
        ctx.drawImage(camera, 0, 0);
        canvas.toBlob(async blob => {
            const file = new File([blob], `camera-${Date.now()}.png`, { type: "image/png" });
            const { data: { session } } = await sb.auth.getSession();
            await sb.storage.from("user-uploads").upload(`${session.user.id}/${file.name}`, file);
            loadFiles();
        });
    });

    openSettingsBtn.addEventListener("click", () => settingsPanel.style.display = "block");
    closeSettingsBtn.addEventListener("click", () => settingsPanel.style.display = "none");

});
</script>
</body>
</html>
