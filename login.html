<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body { 
        font-family: Arial, sans-serif; 
        max-width: 400px; 
        margin: 40px auto; 
        padding: 0 20px;
        box-sizing: border-box;
    }
    h1 { text-align: center; color: #222; }
    input { 
        width: 100%; 
        padding: 10px; 
        margin: 8px 0; 
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    button { 
        width: 100%; 
        padding: 10px; 
        margin: 8px 0; 
        cursor: pointer; 
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        transition: background-color 0.2s;
    }
    button:hover { background-color: #0056b3; }
    .msg { 
        text-align: center; 
        padding: 10px;
        border-radius: 4px;
        margin-top: 15px;
    }
    .error { color: #842029; background-color: #f8d7da; border: 1px solid #f5c2c7; }
    .success { color: #0f5132; background-color: #d1e7dd; border: 1px solid #badbcc; }

    #googleSignIn {
      background-color: #db4437;
      color: white;
      border: none;
      font-weight: bold;
    }
    #googleSignIn:hover {
      background-color: #c23321;
    }
    .seperator {
        text-align: center;
        margin: 15px 0;
        font-size: 0.9em;
        color: #6c757d;
    }
  </style>
</head>
<body>
  <h1>Login</h1>

  <input type="email" id="email" placeholder="Email" autocomplete="email" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  
  <button id="login">Login</button>
  <button id="signup">Sign Up</button>

    <div class="seperator">— OR —</div>

  <button id="googleSignIn">Sign in with Google</button>

  <p id="status" class="msg"></p>

  <script>
    // Supabase details
    const SUPABASE_URL = "https://ywivqcxjtvmztktwlepj.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aXZxY3hqdHZtenRrdHdsZXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NzA3NDksImV4cCI6MjA2NzA0Njc0OX0.4KUAOSRj4lnG_HCa-YNGeSReKT99qsEOgfrU9nmvh5s";

    // GitHub Pages correct redirect (MUST be the final, absolute URL)
    const DASHBOARD_URL = "https://luiso-boopo.github.io/photo-app-2/dashboard.html";

    // Create Supabase client
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
      },
    });

    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("login");
    const signupBtn = document.getElementById("signup");
    const googleSignInBtn = document.getElementById("googleSignIn");

    function setStatus(text, type = "") {
      statusEl.className = `msg ${type}`;
      statusEl.textContent = text;
    }

    async function safeAction(btn, fn) {
      btn.disabled = true;
      setStatus("");
      try {
        await fn();
      } catch (e) {
        setStatus(e.message || "Unexpected error", "error");
      }
      btn.disabled = false;
    }

    // ------------------- 🛑 CRITICAL FIXES FOR LOOPING 🛑 -------------------

    // 1. Immediately check for a session and redirect (non-async for speed)
    // This is the single most important step to stop the dashboard immediately pushing back here.
    sb.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            console.log("Session found. Redirecting to dashboard.");
            window.location.replace(DASHBOARD_URL);
        } else {
            // 2. Clear any lingering OAuth tokens from the URL on the login page itself
            // If tokens are here, the auth system processed them, and we need to clean up.
            if (window.location.hash || window.location.search) {
                console.log("Cleaning up OAuth URL fragment/params.");
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }
    });

    // Login button
    loginBtn.addEventListener("click", () => safeAction(loginBtn, async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return setStatus("Enter email and password", "error");

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return setStatus(error.message, "error");

      setStatus("Login successful. Redirecting…", "success");
      // Use replace to prevent user from hitting 'back' to the login page
      window.location.replace(DASHBOARD_URL);
    }));

    // Signup button
    signupBtn.addEventListener("click", () => safeAction(signupBtn, async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) return setStatus("Enter email and password", "error");

      const { error } = await sb.auth.signUp({ 
        email, 
        password,
        // Send email confirmation link back to the login page for best practice
        options: {
            emailRedirectTo: 'https://luiso-boopo.github.io/photo-app-2/login.html'
        }
      });
      if (error) return setStatus(error.message, "error");

      setStatus("Signup successful! Check your email to confirm.", "success");
    }));

    // Google Sign-In
    googleSignInBtn.addEventListener("click", async () => {
      try {
        const { error } = await sb.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: DASHBOARD_URL, // Explicitly tells Google/Supabase where to send the user
            skipBrowserRedirect: false
          },
        });
        if (error) throw error;
      } catch (err) {
        setStatus("Google Sign-In failed: " + err.message, "error");
      }
    });

    // Fallback handler: If a successful sign-in event is detected here, redirect
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) {
        console.log("Auth State Change: SIGNED_IN detected.");
        window.location.replace(DASHBOARD_URL);
      }
    });
  </script>
</body>
</html>
